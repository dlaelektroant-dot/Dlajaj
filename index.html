<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Speedrun Local Game</title>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>
body {
  font-family: Arial;
  background:#111;
  color:white;
  text-align:center;
}

input, button {
  padding:10px;
  margin:5px;
}

table {
  margin:auto;
  border-collapse: collapse;
}

td, th {
  border:1px solid #555;
  padding:8px;
}
</style>
</head>

<body>

<h2>LOGIN (LOCAL)</h2>

<input id="email" placeholder="nick/email"><br>
<button onclick="login()">Login</button>

<p id="status">Nie zalogowano</p>

<hr>

<h2>SPEEDRUN</h2>

<button onclick="startRun()">START</button>

<p id="timer">--</p>

<div class="g-recaptcha"
     data-sitekey="6Le3MtwsAAAAAKj0M63h4rPWl93_5NLx_O4LBQZQ"
     data-callback="captchaDone"></div>

<hr>

<h2>🏆 TOP 10 (LOCAL)</h2>

<table>
<tr><th>#</th><th>User</th><th>Time</th></tr>
<tbody id="board"></tbody>
</table>

<script>

let user = localStorage.getItem("user");
let startTime = 0;
let running = false;

// BAN SYSTEM
function isBanned() {
  let banUntil = localStorage.getItem("ban");
  if (!banUntil) return false;

  return Date.now() < parseInt(banUntil);
}

function setBan(minutes) {
  let until = Date.now() + minutes * 60 * 1000;
  localStorage.setItem("ban", until);
}

// LOGIN
function login() {
  user = email.value;

  if (isBanned()) {
    status.innerText = "❌ ZBANOWANY";
    return;
  }

  localStorage.setItem("user", user);
  status.innerText = "Zalogowany: " + user;
}

// START
function startRun() {
  if (!user) return alert("Zaloguj się!");

  if (isBanned()) {
    alert("Jesteś zbanowany!");
    return;
  }

  startTime = Date.now();
  running = true;

  timer.innerText = "Rozwiąż CAPTCHA!";
}

// CAPTCHA DONE + ANTI CHEAT
function captchaDone() {
  if (!running) return;

  let time = (Date.now() - startTime) / 1000;

  // 🚨 ANTI CHEAT
  if (time < 0.5) {
    setBan(5);
    alert("BAN 5 MIN (<0.5s)");
    return;
  }

  if (time >= 0.5 && time <= 2) {
    setBan(3);
    alert("BAN 3 MIN (podejrzany czas)");
    return;
  }

  // SAVE SCORE
  let scores = JSON.parse(localStorage.getItem("scores") || "[]");

  scores.push({
    user,
    time: time.toFixed(2)
  });

  localStorage.setItem("scores", JSON.stringify(scores));

  running = false;

  loadBoard();
}

// TOP 10
function loadBoard() {
  let scores = JSON.parse(localStorage.getItem("scores") || "[]");

  scores.sort((a,b) => a.time - b.time);

  scores = scores.slice(0,10);

  board.innerHTML = scores.map((s,i) =>
    `<tr><td>#${i+1}</td><td>${s.user}</td><td>${s.time}s</td></tr>`
  ).join("");
}

loadBoard();

if (user) status.innerText = "Zalogowany: " + user;

</script>

</body>
</html>
