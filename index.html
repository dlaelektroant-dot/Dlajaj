<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<h2>🔥 reCAPTCHA SPEEDRUN</h2>

<button id="startBtn">START RUN</button>

<p id="timer">Kliknij START</p>

<div id="captcha" style="display:none; margin-top:20px;">
  <div class="g-recaptcha"
       data-sitekey="6Ld31dssAAAAAAneHkIQHYYjJ3toV7QCQ5nHamMr"
       data-callback="onSolved"></div>
</div>

<script>
let startTime;
let running = false;

const timer = document.getElementById("timer");
const startBtn = document.getElementById("startBtn");
const captcha = document.getElementById("captcha");

startBtn.onclick = () => {
  captcha.style.display = "block";

  startTime = Date.now();
  running = true;

  timer.innerText = "⏱ RUN STARTED... solve CAPTCHA!";
};

function onSolved() {
  if (!running) return;

  let time = ((Date.now() - startTime) / 1000).toFixed(2);

  timer.innerText = "🔥 Twój czas: " + time + "s";

  running = false;
}
</script>
