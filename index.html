<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Speedrun CAPTCHA Game</title>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial;
  background:#111;
  color:white;
  text-align:center;
}

input, button {
  padding:10px;
  margin:5px;
}

table {
  margin:auto;
  border-collapse: collapse;
}

td, th {
  border:1px solid #555;
  padding:8px;
}
</style>
</head>

<body>

<h2>LOGIN / REGISTER</h2>

<input id="email" placeholder="email"><br>
<input id="pass" type="password" placeholder="hasło"><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<p id="status">Ładowanie...</p>

<hr>

<h2>CAPTCHA SPEEDRUN</h2>

<button onclick="startRun()">START</button>

<p id="timer">--</p>

<div id="captchaBox">
  <div class="g-recaptcha"
       data-sitekey="6Le3MtwsAAAAAKj0M63h4rPWl93_5NLx_O4LBQZQ"
       data-callback="captchaDone"></div>
</div>

<hr>

<h2>🏆 TOP 10</h2>

<table>
<tr><th>#</th><th>User</th><th>Time</th></tr>
<tbody id="board"></tbody>
</table>

<script>

// 🔥 SUPABASE
const supabaseClient = supabase.createClient(
  "https://nyqnoripxurxzvqdscvk.supabase.co",
  "sb_publishable_WgF6awCarvzBPcFAmIohgg_uOGaGvSh"
);

let user = null;
let startTime = 0;
let running = false;

// AUTO LOGIN
async function checkSession() {
  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    user = data.session.user;
    status.innerText = "Zalogowany: " + user.email;
  } else {
    status.innerText = "Nie zalogowano";
  }
}

checkSession();

// REGISTER
async function register() {
  let { error } = await supabaseClient.auth.signUp({
    email: email.value,
    password: pass.value
  });

  if (error) alert(error.message);
  else alert("Zarejestrowano");
}

// LOGIN
async function login() {
  let { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email.value,
    password: pass.value
  });

  if (error) return alert(error.message);

  user = data.user;
  status.innerText = "Zalogowany: " + user.email;
}

// START RUN
function startRun() {
  if (!user) return alert("Zaloguj się!");

  startTime = Date.now();
  running = true;

  timer.innerText = "Rozwiąż CAPTCHA!";
}

// CAPTCHA DONE
async function captchaDone() {
  if (!running) return;

  let time = ((Date.now() - startTime)/1000).toFixed(2);

  timer.innerText = "Twój czas: " + time + "s";

  await supabaseClient.from("scores").insert([
    {
      user: user.email,
      time: parseFloat(time)
    }
  ]);

  running = false;

  loadBoard();
}

// 🏆 TOP 10 LEADERBOARD
async function loadBoard() {
  let { data } = await supabaseClient
    .from("scores")
    .select("*")
    .order("time", { ascending: true })
    .limit(10);

  if (!data) return;

  board.innerHTML = data.map((d, i) =>
    `<tr>
      <td>#${i + 1}</td>
      <td>${d.user}</td>
      <td>${d.time}s</td>
    </tr>`
  ).join("");
}

loadBoard();

</script>

</body>
</html>
