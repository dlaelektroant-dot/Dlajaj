<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Speedrun Auth Core</title>
<style>
body { font-family: Arial; text-align:center; background:#111; color:white; }
input, button { padding:10px; margin:5px; }
table { margin:auto; border-collapse:collapse; width:60%; }
td, th { border:1px solid #555; padding:8px; }
button { cursor:pointer; }
</style>
</head>
<body>

<h2>👤 REJESTRACJA</h2>
<input id="regEmail" placeholder="email">
<input id="regPass" placeholder="hasło">
<button onclick="register()">Register</button>

<h2>🔐 LOGIN</h2>
<input id="logEmail" placeholder="email">
<input id="logPass" placeholder="hasło">
<button onclick="login()">Login</button>

<h3 id="status">Nie zalogowano</h3>

<hr>

<h2>⛏ SPEEDRUN</h2>
<button onclick="startRun()">START</button>
<p id="timer">--</p>

<hr>

<h2>🏁 LEADERBOARD</h2>
<table>
<thead>
<tr><th>User</th><th>Time</th></tr>
</thead>
<tbody id="board"></tbody>
</table>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDWSZtVOHfZ7krDs8zI2vpJq3hUjAtNG2o",
  authDomain: "rechapra-15f8d.firebaseapp.com",
  databaseURL: "https://rechapra-15f8d-default-rtdb.firebaseio.com",
  projectId: "rechapra-15f8d",
  storageBucket: "rechapra-15f8d.appspot.com",
  messagingSenderId: "614103898647",
  appId: "1:614103898647:web:ba1fe6f3bb4896d12e5a52"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let startTime;

// REGISTER
function register() {
  let email = regEmail.value;
  let pass = regPass.value;

  auth.createUserWithEmailAndPassword(email, pass)
    .then(() => alert("Zarejestrowano"))
    .catch(e => alert(e.message));
}

// LOGIN
function login() {
  let email = logEmail.value;
  let pass = logPass.value;

  auth.signInWithEmailAndPassword(email, pass)
    .then(user => {
      document.getElementById("status").innerText =
        "Zalogowany: " + user.user.email;
    })
    .catch(e => alert(e.message));
}

// SPEEDRUN START
function startRun() {
  if (!auth.currentUser) return alert("Zaloguj się!");

  startTime = Date.now();
  document.getElementById("timer").innerText = "RUN STARTED...";

  setTimeout(finishRun, 1000);
}

// FINISH
function finishRun() {
  let time = ((Date.now() - startTime) / 1000).toFixed(2);
  document.getElementById("timer").innerText = "Twój czas: " + time + "s";

  saveScore(auth.currentUser.email, time);
}

// SAVE
function saveScore(user, time) {
  db.ref("scores").push({
    user: user,
    time: parseFloat(time)
  });
}

// LOAD LEADERBOARD
db.ref("scores").on("value", snap => {
  let data = snap.val();
  let html = [];

  if (data) {
    Object.values(data)
      .sort((a,b) => a.time - b.time)
      .forEach(d => {
        html.push(`<tr><td>${d.user}</td><td>${d.time}</td></tr>`);
      });
  }

  board.innerHTML = html.join("");
});
</script>

</body>
</html>
