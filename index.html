<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Speedrun Game</title>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: Arial; text-align:center; background:#111; color:white; }
input, button { padding:10px; margin:5px; }
table { margin:auto; border-collapse:collapse; width:60%; }
td, th { border:1px solid #555; padding:8px; }
</style>
</head>

<body>

<h2>LOGIN</h2>

<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="hasło">

<br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<h3 id="status">Nie zalogowano</h3>

<hr>

<h2>SPEEDRUN</h2>
<button onclick="startRun()">START</button>
<p id="timer">--</p>

<div class="g-recaptcha"
     data-sitekey="6LfPL9wsAAAAAGPzdev5LV-m3Q6OQPqcH_mQyqlM"
     data-callback="captchaDone"></div>

<hr>

<h2>LEADERBOARD</h2>

<table>
<tr><th>User</th><th>Time</th></tr>
<tbody id="board"></tbody>
</table>

<script>

// SUPABASE
const supabaseClient = supabase.createClient(
  "https://nyqnoripxurxzvqdscvk.supabase.co",
  "sb_publishable_WgF6awCarvzBPcFAmIohgg_uOGaGvSh"
);

let user = null;
let startTime;
let running = false;

// REGISTER
async function register() {
  const { error } = await supabaseClient.auth.signUp({
    email: email.value,
    password: pass.value
  });

  if (error) return alert(error.message);
  alert("OK");
}

// LOGIN
async function login() {
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email.value,
    password: pass.value
  });

  if (error) return alert(error.message);

  user = data.user;
  status.innerText = "Zalogowany: " + user.email;
}

// START
function startRun() {
  if (!user) return alert("Zaloguj się!");

  running = true;
  startTime = Date.now();
  timer.innerText = "Rozwiąż CAPTCHA!";
}

// CAPTCHA DONE
async function captchaDone() {
  if (!running) return;

  let time = ((Date.now() - startTime) / 1000).toFixed(2);

  timer.innerText = "Twój czas: " + time + "s";

  await supabaseClient.from("scores").insert([
    { user: user.email, time: parseFloat(time) }
  ]);

  running = false;

  loadBoard();
}

// LEADERBOARD
async function loadBoard() {
  let { data } = await supabaseClient
    .from("scores")
    .select("*")
    .order("time", { ascending: true });

  if (!data) return;

  board.innerHTML = data.map(d =>
    `<tr><td>${d.user}</td><td>${d.time}</td></tr>`
  ).join("");
}

loadBoard();

</script>

</body>
</html>
