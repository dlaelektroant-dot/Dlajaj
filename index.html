<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<h2>🔥 LOGIN TEST</h2>

<form id="form">
  <div class="g-recaptcha" data-sitekey="TWÓJ_SITE_KEY"></div>

  <button type="submit">Start speedrun</button>
</form>

<hr>

<h2>⏱ SPEEDRUN CHALLENGE</h2>
<p id="timer">Kliknij START po CAPTCHA</p>

<button id="startBtn" disabled>START</button>
<button class="mc" style="display:none;">Klik!</button>
<button class="mc" style="display:none;">Klik!</button>
<button class="mc" style="display:none;">Klik!</button>

<script>
let startTime;

const form = document.getElementById("form");
const startBtn = document.getElementById("startBtn");
const timer = document.getElementById("timer");
const buttons = document.querySelectorAll(".mc");

form.onsubmit = (e) => {
  e.preventDefault();

  if (grecaptcha.getResponse().length === 0) {
    alert("Zrób reCAPTCHA");
    return;
  }

  startBtn.disabled = false;
  alert("CAPTCHA zaliczona — odblokowano speedrun 😈");
};

startBtn.onclick = () => {
  startTime = Date.now();
  startBtn.disabled = true;

  buttons.forEach(b => b.style.display = "inline-block");

  buttons.forEach(b => {
    b.onclick = () => {
      let time = ((Date.now() - startTime) / 1000).toFixed(2);
      timer.innerText = "🔥 Twój czas: " + time + "s";
    };
  });
};
</script>
