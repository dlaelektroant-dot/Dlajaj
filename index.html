<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Speedrun Game</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #111;
  color: white;
}

input, button {
  padding: 10px;
  margin: 5px;
}

table {
  margin: auto;
  border-collapse: collapse;
  width: 60%;
}

td, th {
  border: 1px solid #555;
  padding: 8px;
}

button {
  cursor: pointer;
}
</style>
</head>

<body>

<h2>👤 LOGIN / REGISTER</h2>

<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="hasło">

<br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<h3 id="status">Nie zalogowano</h3>

<hr>

<h2>⛏ SPEEDRUN</h2>
<button onclick="startRun()">START</button>

<p id="timer">--</p>

<hr>

<h2>🏁 LEADERBOARD</h2>
<table>
<tr><th>User</th><th>Time</th></tr>
<tbody id="board"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// 🔥 TWOJE SUPABASE DANE
const supabaseClient = supabase.createClient(
  "https://nyqnoripxurxzvqdscvk.supabase.co",
  "sb_publishable_WgF6awCarvzBPcFAmIohgg_uOGaGvSh"
);

let user = null;
let startTime;

// REGISTER
async function register() {
  const { error } = await supabaseClient.auth.signUp({
    email: email.value,
    password: pass.value
  });

  if (error) return alert(error.message);

  alert("Zarejestrowano!");
}

// LOGIN
async function login() {
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email.value,
    password: pass.value
  });

  if (error) return alert(error.message);

  user = data.user;
  status.innerText = "Zalogowany: " + user.email;
}

// START RUN
function startRun() {
  if (!user) return alert("Zaloguj się!");

  startTime = Date.now();
  timer.innerText = "RUN STARTED...";

  setTimeout(finishRun, 1000);
}

// FINISH RUN
async function finishRun() {
  let time = ((Date.now() - startTime) / 1000).toFixed(2);

  timer.innerText = "Twój czas: " + time + "s";

  await supabaseClient.from("scores").insert([
    { user: user.email, time: parseFloat(time) }
  ]);

  loadBoard();
}

// LOAD LEADERBOARD
async function loadBoard() {
  let { data } = await supabaseClient
    .from("scores")
    .select("*")
    .order("time", { ascending: true });

  if (!data) return;

  board.innerHTML = data.map(d =>
    `<tr><td>${d.user}</td><td>${d.time}</td></tr>`
  ).join("");
}

loadBoard();
</script>

</body>
</html>
